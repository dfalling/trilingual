name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  android:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the JDK (and sops/age) from mise.toml so CI and local builds
      # share one source of truth.
      - uses: jdx/mise-action@v2

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint, unit tests, debug build
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon --stacktrace
